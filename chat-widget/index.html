<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual — CHZN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================
           WIDGET DE CHAT — CHZN
           Cole este arquivo no seu WordPress via plugin
           "Insert Headers and Footers" ou similar
        ================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- Botão Flutuante --- */
        #chzn-chat-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            box-shadow: 0 6px 24px rgba(26, 115, 232, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: pulse-ring 2.5s infinite;
        }

        #chzn-chat-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(26, 115, 232, 0.55);
        }

        #chzn-chat-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.5);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(26, 115, 232, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(26, 115, 232, 0);
            }
        }

        /* Badge de notificação */
        #chzn-chat-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #f44336;
            border-radius: 50%;
            border: 2px solid #fff;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Janela de Chat --- */
        #chzn-chat-window {
            position: fixed;
            bottom: 104px;
            right: 28px;
            width: 380px;
            max-width: calc(100vw - 32px);
            height: 560px;
            max-height: calc(100vh - 140px);
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            z-index: 9998;
            overflow: hidden;
            transform: scale(0.85) translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Inter', sans-serif;
        }

        #chzn-chat-window.open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        /* Header */
        #chzn-chat-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #chzn-chat-avatar {
            width: 44px;
            height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            object-fit: contain;
            padding: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        #chzn-chat-header-info h3 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        #chzn-chat-header-info span {
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: #4cff91;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        #chzn-chat-close,
        #chzn-chat-refresh {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            line-height: 1;
            padding: 4px;
            transition: color 0.2s;
        }

        #chzn-chat-close {
            margin-left: 8px;
        }

        #chzn-chat-refresh {
            margin-left: auto;
            font-size: 22px;
        }

        #chzn-chat-close:hover,
        #chzn-chat-refresh:hover {
            color: #fff;
        }

        /* Mensagens */
        #chzn-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f7f9fc;
        }

        #chzn-chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        #chzn-chat-messages::-webkit-scrollbar-thumb {
            background: #d0d8e8;
            border-radius: 4px;
        }

        .chzn-msg {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeInUp 0.25s ease;
            word-break: break-word;
            white-space: pre-wrap;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chzn-msg.bot {
            background: #fff;
            color: #1e293b;
            border-radius: 16px 16px 16px 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            align-self: flex-start;
        }

        .chzn-msg.user {
            background: linear-gradient(135deg, #1a73e8, #1557b0);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
            align-self: flex-end;
        }

        /* Indicador de digitação */
        .chzn-typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 16px 16px 16px 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            align-self: flex-start;
            width: fit-content;
        }

        .chzn-typing span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .chzn-typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chzn-typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-8px);
            }
        }

        /* Mensagem de boas-vindas */
        #chzn-chat-welcome {
            background: linear-gradient(135deg, #e8f0fe, #d2e3fc);
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            color: #1a73e8;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
        }

        /* Sugestões rápidas */
        #chzn-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 16px 12px;
            background: #f7f9fc;
        }

        .chzn-suggestion {
            background: #fff;
            border: 1.5px solid #d0d8e8;
            border-radius: 20px;
            padding: 6px 13px;
            font-size: 12px;
            color: #1a73e8;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .chzn-suggestion:hover {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }

        /* Input */
        #chzn-chat-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid #e8ecf4;
            background: #fff;
        }

        #chzn-chat-input {
            flex: 1;
            border: 1.5px solid #e0e7ef;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            color: #1e293b;
            transition: border-color 0.2s;
            resize: none;
            background: #f7f9fc;
        }

        #chzn-chat-input:focus {
            border-color: #1a73e8;
            background: #fff;
        }

        #chzn-chat-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s, opacity 0.15s;
        }

        #chzn-chat-send:hover {
            transform: scale(1.1);
        }

        #chzn-chat-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #chzn-chat-send svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* Rodapé */
        #chzn-chat-footer {
            text-align: center;
            padding: 6px;
            font-size: 10px;
            color: #94a3b8;
            background: #fff;
        }

        /* --- Painel de Avaliação --- */
        #chzn-avaliacao {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex: 1;
            padding: 28px 20px;
            background: #f7f9fc;
            animation: fadeInUp 0.3s ease;
        }

        #chzn-avaliacao h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
        }

        #chzn-avaliacao p {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }

        #chzn-estrelas {
            display: flex;
            gap: 8px;
        }

        .chzn-estrela {
            font-size: 32px;
            cursor: pointer;
            color: #d0d8e8;
            transition: color 0.15s, transform 0.15s;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }

        .chzn-estrela:hover,
        .chzn-estrela.selecionada {
            color: #f59e0b;
            transform: scale(1.15);
        }

        #chzn-comentario {
            width: 100%;
            border: 1.5px solid #e0e7ef;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            resize: none;
            height: 72px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        #chzn-comentario:focus {
            border-color: #1a73e8;
        }

        #chzn-avaliacao-btns {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #chzn-btn-enviar-avaliacao {
            flex: 1;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 10px 0;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }

        #chzn-btn-enviar-avaliacao:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        #chzn-btn-pular-avaliacao {
            background: none;
            border: 1.5px solid #d0d8e8;
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            color: #64748b;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        #chzn-btn-pular-avaliacao:hover {
            border-color: #94a3b8;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            #chzn-chat-window {
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                height: 70vh;
            }

            #chzn-chat-btn {
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Demonstração do widget no site -->
    <div style="font-family: Inter, sans-serif; padding: 60px; text-align: center; color: #1e293b;">
        <h1 style="font-size: 32px; margin-bottom: 12px;">Agente de IA — CHZN</h1>
        <p style="color: #64748b; font-size: 16px;">Clique no botão azul no canto inferior direito para conversar com a
            assistente virtual.</p>
    </div>

    <!-- =====================================================
     WIDGET — Cole apenas este bloco no seu WordPress
     (via Insert Headers and Footers ou rodapé do tema)
====================================================== -->

    <!-- Botão Flutuante -->
    <button id="chzn-chat-btn" aria-label="Abrir chat" onclick="chznToggleChat()">
        <div id="chzn-chat-badge">1</div>
        <svg viewBox="0 0 24 24">
            <path
                d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" />
        </svg>
    </button>

    <!-- Janela de Chat -->
    <div id="chzn-chat-window" role="dialog" aria-label="Chat com a assistente virtual">
        <!-- Header -->
        <div id="chzn-chat-header">
            <img id="chzn-chat-avatar" src="" alt="Avatar Assistente" />
            <div id="chzn-chat-header-info">
                <h3>Assistente Virtual CHZN</h3>
                <span><span class="online-dot"></span>Online agora</span>
            </div>
            <button id="chzn-chat-refresh" aria-label="Nova conversa" onclick="chznResetChat()"
                title="Reiniciar conversa">⟳</button>
            <button id="chzn-chat-close" aria-label="Fechar chat" onclick="chznToggleChat()" title="Fechar">✕</button>
        </div>

        <!-- Mensagens -->
        <div id="chzn-chat-messages">
            <div id="chzn-chat-welcome">
                👋 Olá! Sou a assistente virtual do CHZN.<br>
                Como posso ajudar você hoje?
            </div>
        </div>

        <!-- Sugestões Rápidas -->
        <div id="chzn-suggestions">
            <button class="chzn-suggestion" onclick="chznSendSuggestion(this)">🏨 Visita na UTI</button>
            <button class="chzn-suggestion" onclick="chznSendSuggestion(this)">👩‍💻 O que é o SAU </button>
            <button class="chzn-suggestion" onclick="chznSendSuggestion(this)">🔪 Cancelar cirurgia</button>
            <button class="chzn-suggestion" onclick="chznSendSuggestion(this)">📋 Horários de visita</button>
        </div>

        <!-- Input -->
        <div id="chzn-chat-input-area">
            <input type="text" id="chzn-chat-input" placeholder="Digite sua dúvida..." maxlength="500"
                onkeydown="if(event.key==='Enter') chznSendMessage()" aria-label="Digite sua mensagem" />
            <button id="chzn-chat-send" onclick="chznSendMessage()" aria-label="Enviar mensagem">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>

        <!-- Painel de Avaliação -->
        <div id="chzn-avaliacao">
            <h4>Como foi o atendimento?</h4>
            <p>Sua opinião nos ajuda a melhorar! 😊</p>
            <div id="chzn-estrelas">
                <button class="chzn-estrela" data-nota="1" onclick="chznSelecionarNota(1)"
                    aria-label="1 estrela">★</button>
                <button class="chzn-estrela" data-nota="2" onclick="chznSelecionarNota(2)"
                    aria-label="2 estrelas">★</button>
                <button class="chzn-estrela" data-nota="3" onclick="chznSelecionarNota(3)"
                    aria-label="3 estrelas">★</button>
                <button class="chzn-estrela" data-nota="4" onclick="chznSelecionarNota(4)"
                    aria-label="4 estrelas">★</button>
                <button class="chzn-estrela" data-nota="5" onclick="chznSelecionarNota(5)"
                    aria-label="5 estrelas">★</button>
            </div>
            <textarea id="chzn-comentario" placeholder="Deixe um comentário (opcional)..." maxlength="300"></textarea>
            <div id="chzn-avaliacao-btns">
                <button id="chzn-btn-pular-avaliacao" onclick="chznEnviarAvaliacao()"
                    aria-label="Pular avaliação">Pular</button>
                <button id="chzn-btn-enviar-avaliacao" onclick="chznEnviarAvaliacao()"
                    aria-label="Enviar avaliação">Enviar ⭐</button>
            </div>
        </div>

        <div id="chzn-chat-footer">Powered by M2L</div>
    </div>

    <script>
        // =====================================================
        // CONFIGURAÇÃO — altere apenas esta linha:
        // =====================================================
        const CHZN_API_URL = "http://localhost:3000"; // ← Após deploy, cole a URL do Railway aqui
        // Gera ou recupera o ID de sessão único do visitante
        let chznSessionId = (() => {
            let id = localStorage.getItem("chzn_session");
            if (!id) {
                id = "web_" + Math.random().toString(36).slice(2) + Date.now();
                localStorage.setItem("chzn_session", id);
            }
            return id;
        })();

        // Define a foto de perfil automaticamente com base na API
        document.getElementById("chzn-chat-avatar").src = CHZN_API_URL + "/widget/avatar.png";

        let chznOpen = false;
        let chznBusy = false;
        let chznInactivityTimer = null;

        function chznResetTimer() {
            clearTimeout(chznInactivityTimer);
            if (!chznOpen) return;

            // Auto-finaliza após 90 segundos de inatividade
            chznInactivityTimer = setTimeout(() => {
                chznAddMessage("Sessão finalizada por inatividade.", "bot");
                setTimeout(chznResetChat, 3000);
            }, 90000);
        }

        function chznToggleChat() {
            if (chznOpen) {
                chznMostrarAvaliacao();
                return;
            }
            chznOpen = true;
            const win = document.getElementById("chzn-chat-window");
            const badge = document.getElementById("chzn-chat-badge");
            win.classList.add("open");
            badge.style.display = "none";
            document.getElementById("chzn-chat-input").focus();
            chznResetTimer();
            chznRegistrarAcesso();
        }

        function chznResetChat() {
            clearTimeout(chznInactivityTimer);

            // Reseta o conteúdo da janela de mensagens
            document.getElementById("chzn-chat-messages").innerHTML = `
                <div id="chzn-chat-welcome">
                    👋 Olá! Sou a assistente virtual do CHZN.<br>
                    Como posso ajudar você hoje?
                </div>
            `;
            document.getElementById("chzn-chat-messages").style.display = "flex";

            // Mostra sugestões novamente
            document.getElementById("chzn-suggestions").style.display = "flex";

            // Gera nova sessão
            chznSessionId = "web_" + Math.random().toString(36).slice(2) + Date.now();
            localStorage.setItem("chzn_session", chznSessionId);

            chznResetTimer();
        }

        function chznRegistrarAcesso() {
            if (sessionStorage.getItem("chzn_acesso_registrado")) return;

            fetch(`${CHZN_API_URL}/metricas/acesso`, { method: "POST" })
                .then(() => sessionStorage.setItem("chzn_acesso_registrado", "1"))
                .catch((e) => console.error("Erro ao registrar acesso:", e));
        }

        // --- 2) Avaliação por estrelas ---
        function chznMostrarAvaliacao() {
            document.getElementById("chzn-chat-messages").style.display = "none";
            document.getElementById("chzn-suggestions").style.display = "none";
            document.getElementById("chzn-avaliacao").style.display = "flex";
        }

        function chznSelecionarNota(nota) {
            document.querySelectorAll("#chzn-avaliacao .chzn-estrela").forEach((el) => {
                el.classList.toggle("selecionada", parseInt(el.dataset.nota, 10) <= nota);
            });
            document.getElementById("chzn-avaliacao").dataset.notaAtual = nota;
        }

        function chznEnviarAvaliacao() {
            const nota = parseInt(document.getElementById("chzn-avaliacao").dataset.notaAtual || "0", 10);
            const comentario = document.getElementById("chzn-comentario").value;

            if (!nota) {
                chznFinalizarAposAvaliacao(); // usuário fechou sem escolher nota, apenas encerra
                return;
            }

            fetch(`${CHZN_API_URL}/metricas/avaliacao`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nota, comentario }),
            })
                .catch((e) => console.error("Erro ao enviar avaliação:", e))
                .finally(chznFinalizarAposAvaliacao);
        }

        function chznFinalizarAposAvaliacao() {
            // Restaura a tela e realmente fecha/reinicia o chat
            document.getElementById("chzn-avaliacao").style.display = "none";
            document.getElementById("chzn-comentario").value = "";
            document.getElementById("chzn-avaliacao").dataset.notaAtual = "";
            document.querySelectorAll("#chzn-avaliacao .chzn-estrela").forEach((el) =>
                el.classList.remove("selecionada")
            );
            document.getElementById("chzn-chat-messages").style.display = "block";

            chznResetChat();

            // Limpa o flag para que a próxima abertura do chat seja contabilizada como novo acesso
            sessionStorage.removeItem("chzn_acesso_registrado");

            const win = document.getElementById("chzn-chat-window");
            win.classList.remove("open");
            chznOpen = false;
            clearTimeout(chznInactivityTimer);
        }

        function chznAddMessage(text, role) {
            const container = document.getElementById("chzn-chat-messages");
            const div = document.createElement("div");
            div.className = "chzn-msg " + role;

            // Escapa HTML básico para segurança e converte **negrito** do markdown
            const escapeDiv = document.createElement("div");
            escapeDiv.textContent = text;
            let htmlText = escapeDiv.innerHTML;
            htmlText = htmlText.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

            div.innerHTML = htmlText;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function chznShowTyping() {
            const container = document.getElementById("chzn-chat-messages");
            const typing = document.createElement("div");
            typing.className = "chzn-typing";
            typing.id = "chzn-typing";
            typing.innerHTML = "<span></span><span></span><span></span>";
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
        }

        function chznHideTyping() {
            const el = document.getElementById("chzn-typing");
            if (el) el.remove();
        }

        function chznSendSuggestion(btn) {
            const text = btn.textContent.replace(/^[^\w]+/, "").trim();
            document.getElementById("chzn-suggestions").style.display = "none";
            chznSendText(text);
        }

        function chznSendMessage() {
            const input = document.getElementById("chzn-chat-input");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            document.getElementById("chzn-suggestions").style.display = "none";
            chznSendText(text);
        }

        async function chznSendText(text) {
            if (chznBusy) return;
            chznBusy = true;
            chznResetTimer();

            const sendBtn = document.getElementById("chzn-chat-send");
            sendBtn.disabled = true;

            chznAddMessage(text, "user");
            chznShowTyping();

            try {
                const res = await fetch(`${CHZN_API_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mensagem: text, sessionId: chznSessionId })
                });

                const data = await res.json();
                chznHideTyping();

                if (data.resposta) {
                    chznAddMessage(data.resposta, "bot");
                } else {
                    chznAddMessage("Desculpe, não consegui processar sua mensagem. Tente novamente.", "bot");
                }
            } catch (e) {
                chznHideTyping();
                chznAddMessage("Serviço temporariamente indisponível. Tente novamente em instantes.", "bot");
            }

            chznBusy = false;
            sendBtn.disabled = false;
            document.getElementById("chzn-chat-input").focus();
            chznResetTimer();
        }
    </script>
    <!-- === FIM DO WIDGET === -->

</body>
